plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.aifirst.launcher'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'dev.aifirst.launcher'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
